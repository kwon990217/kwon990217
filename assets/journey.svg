<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">권혁주의 경력과 교육</title>
<desc id="desc">서울소프트 2026년 8월부터 재직. 데이터 분석 과정 2025년 12월부터 2026년 2월 수료. KB IT’s Your Life 6기 2025년 3월부터 8월 수료. 청주대학교 전자공학과 2018년부터 2024년 졸업.</desc>
<style>
:root{--bg:#161b22;--ink:#e6edf3;--muted:#9da7b3;--line:#39424e;--accent:#adbed0;--card:#21262d;--pill:#3c4756;--white:#f0f3f6}
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif}.mono{font-family:Consolas,monospace}.ink{fill:var(--ink)}.muted{fill:var(--muted)}
</style>
